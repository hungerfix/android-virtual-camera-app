name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check for Gradle wrapper
        id: wrapper_check
        run: |
          if [ -f "./gradlew" ]; then
            echo "has_wrapper=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_wrapper=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Grant execute permission for gradlew
        if: steps.wrapper_check.outputs.has_wrapper == 'true'
        run: chmod +x gradlew

      - name: Build debug APK (using wrapper)
        if: steps.wrapper_check.outputs.has_wrapper == 'true'
        run: ./gradlew assembleDebug --stacktrace

      - name: Build debug APK (using system Gradle, no wrapper found)
        if: steps.wrapper_check.outputs.has_wrapper == 'false'
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
