name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Create Gradle version catalog
        run: |
          mkdir -p gradle

          cat > gradle/libs.versions.toml <<'EOF'
          [versions]
          agp = "8.1.2"
          kotlin = "1.9.10"

          [plugins]
          android-application = { id = "com.android.application", version.ref = "agp" }
          kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
          kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
          EOF

      - name: Show project files
        run: |
          echo "===== ROOT ====="
          ls -la

          echo "===== GRADLE ====="
          cat gradle/libs.versions.toml

      - name: Check Gradle configuration
        run: |
          gradle tasks --stacktrace

      - name: Build Debug APK
        run: |
          set +e

          gradle assembleDebug --stacktrace 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "BUILD ERROR SUMMARY"
          echo "========================================"

          grep -A 20 -B 5 \
            -E "FAILURE:|What went wrong:|Execution failed for task|Could not resolve|e: |error:" \
            build.log || true

          echo "========================================"

          exit $EXIT_CODE

      - name: Find APK
        if: success()
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCamera-debug
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
